name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Without this the default GITHUB_TOKEN is read-only and creating the release below
# fails with "Resource not accessible by integration" (403). The build itself does not
# need anything else.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build signed release APK
        env:
          DOPAMINE_STORE_PASSWORD: ${{ secrets.DOPAMINE_STORE_PASSWORD }}
          DOPAMINE_KEY_PASSWORD: ${{ secrets.DOPAMINE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -lh out
      - name: Verify the APK is signed with the release key
        run: |
          APK=$(ls out/*.apk | head -1)
          echo "APK: $APK"
          # apksigner is part of build-tools; fail loudly rather than publishing an unsigned or
          # debug-signed APK if the keystore secret is missing.
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" || {
            echo "::error::$APK is not signed correctly"; exit 1; }


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-debug-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dopamine (Android) build ${{ github.run_number }}
          files: out/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}